[project]
name = "gxw3call"
version = "0.1.1"
description = "Drive GX Works3 from Python through its Open Interface (GXW3Call.dll)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Wadangzz" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["gx works3", "mitsubishi", "melsec", "plc", "com", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/Wadangzz/py-gxw3call"
Issues = "https://github.com/Wadangzz/py-gxw3call/issues"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gxw3call"]

[tool.hatch.build.targets.sdist]
include = ["src", "docs", "notes", "tools", "examples", "tests", "LICENSE", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
indent-width = 4

[tool.ruff.lint]
# pycodestyle (PEP 8), pyflakes, import order, PEP 8 naming
select = ["E", "W", "F", "I", "N"]

[tool.ruff.lint.per-file-ignores]
# generated: docstrings quote type library signatures and measured notes
"src/gxw3call/api.py" = ["E501"]

[tool.ruff.format]
quote-style = "single"
